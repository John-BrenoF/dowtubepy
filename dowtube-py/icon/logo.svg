<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">

  <!-- YouTube-style rounded rectangle -->
  <rect x="4" y="18" width="92" height="64" rx="14" ry="14" fill="black"/>

  <!-- Cat ear - left (pointy triangle on top-left corner of rect) -->
  <polygon points="14,18 8,6 26,18" fill="black"/>
  <!-- Cat ear inner left -->
  <polygon points="14,16 10,8 22,16" fill="white"/>

  <!-- Cat ear - right -->
  <polygon points="86,18 92,6 74,18" fill="black"/>
  <!-- Cat ear inner right -->
  <polygon points="86,16 90,8 78,16" fill="white"/>

  <!-- Cat paw pad (main central pad) - replaces the play button area -->
  <!-- Central big pad -->
  <ellipse cx="50" cy="55" rx="11" ry="10" fill="white"/>

  <!-- Top left toe -->
  <ellipse cx="33" cy="44" rx="6" ry="5.5" fill="white"/>
  <!-- Top right toe -->
  <ellipse cx="67" cy="44" rx="6" ry="5.5" fill="white"/>
  <!-- Bottom left toe -->
  <ellipse cx="38" cy="62" rx="5.5" ry="5" fill="white"/>
  <!-- Bottom right toe -->
  <ellipse cx="62" cy="62" rx="5.5" ry="5" fill="white"/>

  <!-- Download arrow overlaid on the center pad -->
  <!-- Arrow shaft -->
  <rect x="47.5" y="48" width="5" height="9" rx="1" fill="black"/>
  <!-- Arrow head -->
  <polygon points="50,61 44,54 56,54" fill="black"/>
  <!-- Small underline bar below arrow -->
  <rect x="44" y="62" width="12" height="2" rx="1" fill="black"/>

</svg>
